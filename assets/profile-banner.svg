<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Jenitzio — Developer and Builder</title>
  <desc id="desc">A neon gradient banner with abstract orbital shapes, representing web development, games, and creative software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d24"/>
      <stop offset="52%" stop-color="#17103d"/>
      <stop offset="100%" stop-color="#071f35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#42e8e0"/>
      <stop offset="48%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#ff70c7"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#5c55ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5c55ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#08d9d2" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#08d9d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8b8ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <ellipse cx="920" cy="72" rx="390" ry="270" fill="url(#glowA)"/>
  <ellipse cx="180" cy="320" rx="390" ry="220" fill="url(#glowB)"/>
  <g fill="none" stroke="url(#shine)" stroke-opacity=".7">
    <ellipse cx="1000" cy="165" rx="270" ry="91" stroke-width="1.6" transform="rotate(-22 1000 165)"/>
    <ellipse cx="1000" cy="165" rx="220" ry="62" stroke-width="1.2" transform="rotate(25 1000 165)"/>
    <circle cx="1025" cy="151" r="86" stroke-width="1.4"/>
  </g>
  <g fill="url(#shine)">
    <circle cx="830" cy="62" r="4"/><circle cx="1080" cy="250" r="4"/>
    <circle cx="1120" cy="110" r="3"/><circle cx="880" cy="244" r="3"/>
    <circle cx="735" cy="160" r="2.5"/><circle cx="1154" cy="190" r="2.5"/>
  </g>
  <g fill="#dce5ff" fill-opacity=".62">
    <circle cx="92" cy="62" r="1.8"/><circle cx="150" cy="260" r="1.8"/>
    <circle cx="430" cy="68" r="1.5"/><circle cx="600" cy="275" r="1.8"/>
    <circle cx="695" cy="82" r="1.6"/><circle cx="365" cy="285" r="1.6"/>
  </g>
  <rect x="68" y="68" width="5" height="192" rx="2.5" fill="url(#shine)"/>
  <text x="100" y="151" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="4">JENITZIO</text>
  <rect x="102" y="175" width="255" height="4" rx="2" fill="url(#shine)"/>
  <text x="101" y="214" fill="#c9d5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="3">CODE  •  CREATE  •  BUILD</text>
  <text x="101" y="250" fill="#93a6d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.2">WEB DEVELOPMENT · GAMES · CREATIVE SOFTWARE</text>
  <g transform="translate(101 278)">
    <rect width="104" height="25" rx="12.5" fill="#42e8e0" fill-opacity=".12" stroke="#42e8e0" stroke-opacity=".7"/>
    <text x="52" y="17" text-anchor="middle" fill="#8df6ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">JAVASCRIPT</text>
    <rect x="115" width="76" height="25" rx="12.5" fill="#a18bff" fill-opacity=".12" stroke="#a18bff" stroke-opacity=".7"/>
    <text x="153" y="17" text-anchor="middle" fill="#c6baff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">PYTHON</text>
    <rect x="202" width="65" height="25" rx="12.5" fill="#ff70c7" fill-opacity=".12" stroke="#ff70c7" stroke-opacity=".7"/>
    <text x="234.5" y="17" text-anchor="middle" fill="#ffb0df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">C++</text>
  </g>
</svg>